apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  imageUpdater:
    enabled: true
    env:
      - name: ENABLE_WEBHOOK
        value: "true"
      - name: ARGOCD_NAMESPACE
        value: "argocd"
      - name: IMAGE_UPDATER_WATCH_NAMESPACES
        value: "argocd,petclinic-argocd"
