apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  imageUpdater:
    enabled: true
    env:
      - name: ENABLE_WEBHOOK
        value: "true"
      - name: ARGOCD_NAMESPACE
        value: "argocd"
      - name: IMAGE_UPDATER_WATCH_NAMESPACES
        value: "argocd,*-argocd"
      # - name: DISABLE_TLS
      #   value: "true"
      - name: QUAY_WEBHOOK_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-image-updater-secret
            key: webhook.quay-secret
