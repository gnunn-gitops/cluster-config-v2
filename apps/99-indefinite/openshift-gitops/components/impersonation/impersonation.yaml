apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  extraConfig:
    application.sync.impersonation.enabled: "false"
    # To enable this with the Agent need the Agent to support this in
    # a similar way to the argocd-server. This means with the Agent the
    # resource proxy will use the Agent SA rather then the ServiceAccount
    # in AppProject.
    # See:
    # https://github.com/argoproj-labs/argocd-agent/issues/1152
    # https://github.com/argoproj-labs/argocd-agent/issues/1136
    application.sync.impersonation.enforced: "false"
