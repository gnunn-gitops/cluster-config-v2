kind: ConfigMap
apiVersion: v1
metadata:
  name: cluster-monitoring-config
data:
  config.yaml: |
    alertmanagerMain:
      enableUserAlertmanagerConfig: true
    enableUserWorkload: true
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      externalLabels:
        cluster_name: hub-prod-local
        managed_cluster: 1800df5d-06d8-4eea-bef8-e7f9ec791610
