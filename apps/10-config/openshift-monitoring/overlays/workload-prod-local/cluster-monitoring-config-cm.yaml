kind: ConfigMap
apiVersion: v1
metadata:
  name: cluster-monitoring-config
data:
  config.yaml: |
    alertmanagerMain:
      enableUserAlertmanagerConfig: true
    enableUserWorkload: true
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      externalLabels:
        cluster_name: workload-prod-local
        managed_cluster: fef08928-3f49-4dcb-8a70-ea2da63dcd2b
