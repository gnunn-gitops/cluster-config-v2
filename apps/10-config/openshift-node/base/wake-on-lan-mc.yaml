apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-networkmanager-wol
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      # [connection]
      # ethernet.wake-on-lan=magic
      - contents:
          source: data:text/plain;charset=utf-8;base64,W2Nvbm5lY3Rpb25dCmV0aGVybmV0Lndha2Utb24tbGFuPW1hZ2ljCg==
        mode: 420
        path: /etc/NetworkManager/conf.d/99-wol.conf
      # The NetworkManager default above is not honoured for the interface that
      # configure-ovs.sh enslaves to br-ex, so the node's real uplink still comes
      # up with wake-on-lan disabled. This script sets the flag with ethtool on
      # every physical NIC that supports magic packets. Decoded contents:
      #
      #   #!/usr/bin/env bash
      #   set -uo pipefail
      #
      #   for path in /sys/class/net/*; do
      #     dev="${path##*/}"
      #     [[ -e "${path}/device" ]] || continue
      #     if ethtool "${dev}" 2>/dev/null | grep -q '^[[:space:]]*Supports Wake-on:.*g'; then
      #       echo "Enabling Wake-on-LAN (magic packet) on ${dev}"
      #       ethtool -s "${dev}" wol g || echo "Failed to set Wake-on-LAN on ${dev}" >&2
      #     fi
      #   done
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        mode: 493
        path: /usr/local/bin/enable-wake-on-lan.sh
    systemd:
      units:
      - name: enable-wake-on-lan.service
        enabled: true
        contents: |
          [Unit]
          Description=Enable Wake-on-LAN (magic packet) on physical network interfaces
          Wants=network-online.target
          After=network-online.target nodeip-configuration.service ovs-configuration.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/enable-wake-on-lan.sh

          [Install]
          WantedBy=multi-user.target
