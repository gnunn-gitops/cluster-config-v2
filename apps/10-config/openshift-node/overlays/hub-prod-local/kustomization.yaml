apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
# hub-server specific, it names this host's two NICs (enp4s0 and enp0s31f6).
# Ignore for now, no automatic reversion for MachineConfig if it fails
#- br-ex-bond-mc.yaml

patches:
  - patch: |
      - op: add
        path: /metadata/labels/machineconfiguration.openshift.io~1role
        value: master
    target:
      kind: MachineConfig
      name: 99-networkmanager-wol
