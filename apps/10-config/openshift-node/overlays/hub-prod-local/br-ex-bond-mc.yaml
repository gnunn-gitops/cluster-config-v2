apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    # hub-server is an SNO node and lives in the master pool, the worker pool has
    # no machines, so a worker-rolled MachineConfig would never be applied.
    machineconfiguration.openshift.io/role: master
  name: 10-br-ex-bond
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      # Bonds enp4s0 (2.5GbE) and enp0s31f6 (1GbE) into bond0 in active-backup
      # mode and makes bond0 the uplink of the OVN-Kubernetes br-ex bridge.
      #
      # br-ex cannot be re-pointed with a NodeNetworkConfigurationPolicy, Red Hat
      # does not support changing br-ex or its underlying interfaces from an NNCP
      # post-install. The supported path is this file: nmstate-configuration.service
      # reads /etc/nmstate/openshift/{<short-hostname>,cluster}.yml, tears down the
      # configure-ovs.sh version of br-ex, and hands the config to nmstate.service,
      # all before ovs-configuration.service runs.
      #
      # bond0 and br-ex pin enp4s0's MAC (02:76:C6:00:9E:BE) so the router keeps
      # handing out 192.168.1.5, both across this cutover and across a failover to
      # enp0s31f6. Decoded contents:
      #
      #   interfaces:
      #     - name: enp4s0
      #       type: ethernet
      #       state: up
      #       mtu: 1500
      #       ipv4:
      #         enabled: false
      #       ipv6:
      #         enabled: false
      #
      #     - name: enp0s31f6
      #       type: ethernet
      #       state: up
      #       mtu: 1500
      #       ipv4:
      #         enabled: false
      #       ipv6:
      #         enabled: false
      #
      #     # primary=enp4s0 keeps the faster 2.5GbE link active whenever it has
      #     # carrier, falling back to the 1GbE link only while enp4s0 is down.
      #     - name: bond0
      #       type: bond
      #       state: up
      #       mtu: 1500
      #       mac-address: 02:76:C6:00:9E:BE
      #       ipv4:
      #         enabled: false
      #       ipv6:
      #         enabled: false
      #       link-aggregation:
      #         mode: active-backup
      #         options:
      #           miimon: 100
      #           primary: enp4s0
      #         port:
      #           - enp4s0
      #           - enp0s31f6
      #
      #     # allow-extra-patch-ports lets OVN-Kubernetes keep its own patch port
      #     # to br-int without nmstate pruning it on re-apply.
      #     - name: br-ex
      #       type: ovs-bridge
      #       state: up
      #       ovs-db:
      #         other_config:
      #           hwaddr: 02:76:C6:00:9E:BE
      #       ipv4:
      #         enabled: false
      #       ipv6:
      #         enabled: false
      #       bridge:
      #         allow-extra-patch-ports: true
      #         options:
      #           stp:
      #             enabled: false
      #           mcast-snooping-enable: false
      #         port:
      #           - name: br-ex
      #           - name: bond0
      #
      #     - name: br-ex
      #       type: ovs-interface
      #       state: up
      #       mtu: 1500
      #       mac-address: 02:76:C6:00:9E:BE
      #       ipv4:
      #         enabled: true
      #         dhcp: true
      #         auto-dns: true
      #         auto-route-metric: 48
      #       ipv6:
      #         enabled: true
      #         dhcp: true
      #         autoconf: true
      #         auto-route-metric: 48
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        mode: 420
        overwrite: true
        path: /etc/nmstate/openshift/cluster.yml
