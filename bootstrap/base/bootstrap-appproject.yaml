apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  destinations:
    - namespace: "*"
      name: hub-prod-local
  destinationServiceAccounts:
    - server: https://kubernetes.default.svc
      namespace: argocd
      defaultServiceAccount: application-controller
  sourceNamespaces:
    - argocd
  sourceRepos:
    - "*"
  roles:
    - name: cluster-admins
      policies:
        - p, proj:bootstrap:admin, applications, *, bootstrap/*, allow
      groups:
        - "cluster-admins"
        - "system:cluster-admins"
